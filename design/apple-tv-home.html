<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>OpenTV Launcher 1.5.0 · Apple TV 风格预览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #141416;
    font-family: -apple-system, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .stage {
    width: 1280px; height: 720px;
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 40px 120px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.08);
    transform-origin: center;
  }
  /* 氛围光：跟随焦点应用主色 */
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(72% 105% at 58% 22%, rgba(255,55,95,.62) 0%, rgba(255,55,95,.24) 50%, rgba(255,55,95,0) 100%),
      linear-gradient(to bottom, rgba(0,0,0,0) 42%, rgba(0,0,0,.70) 100%);
  }
  .content { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .header { padding: 30px 46px 0 46px; }
  .clockrow { display: flex; align-items: flex-end; gap: 14px; }
  .clock { font-size: 34px; font-weight: 200; letter-spacing: .02em; color: #fff; line-height: 1; }
  .date { font-size: 14px; color: #8E8E93; margin-bottom: 6px; }
  .hero { margin-top: 16px; font-size: 40px; font-weight: 500; color: #fff; line-height: 1.1; }
  .herosub { margin-top: 6px; font-size: 15px; color: #8E8E93; }
  .rows { margin-top: 16px; padding: 0 26px 26px; }
  .row { margin-bottom: 14px; }
  .rowtitle { font-size: 15px; font-weight: 500; color: #8E8E93; letter-spacing: .02em; padding: 0 0 8px 20px; }
  .tiles { display: flex; gap: 8px; padding: 8px 14px 12px; }
  .tile { width: 96px; flex: 0 0 auto; text-align: center; }
  .tilebox {
    width: 96px; height: 96px; border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    font-size: 38px; font-weight: 600; color: #fff;
    border: 1px solid rgba(255,255,255,.18);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.24);
    transition: transform .18s cubic-bezier(.2,.8,.3,1), box-shadow .18s;
  }
  .tilelabel { margin-top: 9px; font-size: 13px; color: rgba(255,255,255,.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.focus .tilebox {
    transform: scale(1.08);
    border: 2px solid rgba(255,255,255,.95);
    box-shadow: 0 18px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .tile.focus .tilelabel { color: #fff; }
  .hint {
    position: absolute; left: 0; right: 0; bottom: 14px;
    text-align: center; font-size: 12px; color: rgba(255,255,255,.35);
    letter-spacing: .06em;
  }
  @media (max-width: 1340px) { .stage { transform: scale(.72); } }
  @media (max-width: 980px) { .stage { transform: scale(.52); } }
</style>
</head>
<body>
<div class="stage">
  <div class="glow"></div>
  <div class="content">
    <div class="header">
      <div class="clockrow">
        <div class="clock">22:41</div>
        <div class="date">10月20日 星期二</div>
      </div>
      <div class="hero">哔哩哔哩 TV</div>
      <div class="herosub">影音播放</div>
    </div>

    <div class="rows">
      <div class="row">
        <div class="rowtitle">常用应用</div>
        <div class="tiles">
          <div class="tile focus">
            <div class="tilebox" style="background:linear-gradient(135deg,#ff7aa2,#c4002e)">B</div>
            <div class="tilelabel">哔哩哔哩 TV</div>
          </div>
          <div class="tile">
            <div class="tilebox" style="background:linear-gradient(135deg,#7ad4ff,#0a5aa8)">YT</div>
            <div class="tilelabel">SmartTube</div>
          </div>
          <div class="tile">
            <div class="tilebox" style="background:linear-gradient(135deg,#8ce99a,#1f7a3a)">▶</div>
            <div class="tilelabel">爱奇艺</div>
          </div>
          <div class="tile">
            <div class="tilebox" style="background:linear-gradient(135deg,#ffd479,#c47c00)">☰</div>
            <div class="tilelabel">腾讯视频</div>
          </div>
          <div class="tile">
            <div class="tilebox" style="background:linear-gradient(135deg,#b9a4ff,#4b32a8)">✳</div>
            <div class="tilelabel">优酷 TV</div>
          </div>
          <div class="tile">
            <div class="tilebox" style="background:linear-gradient(135deg,#9fe8ff,#00728f)">⚙</div>
            <div class="tilelabel">设置</div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="rowtitle">电视游戏</div>
        <div class="tiles">
          <div class="tile">
            <div class="tilebox" style="background:linear-gradient(135deg,#ffb27a,#a83d00)">🎮</div>
            <div class="tilelabel">云游戏</div>
          </div>
          <div class="tile">
            <div class="tilebox" style="background:linear-gradient(135deg,#a9f0c0,#187a4a)">♟</div>
            <div class="tilelabel">棋牌</div>
          </div>
          <div class="tile">
            <div class="tilebox" style="background:linear-gradient(135deg,#ffa8a8,#9a1b1b)">🏁</div>
            <div class="tilelabel">竞速</div>
          </div>
        </div>
      </div>
    </div>

    <div class="hint">1.5.0 · 已移除儿童防沉迷与 PIN 锁屏</div>
  </div>
</div>
</body>
</html>
