name: Build OpenTV Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      id: gradle_build
      shell: bash
      run: |
        set -o pipefail
        ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

    - name: Annotate Error on Failure
      if: failure()
      shell: bash
      run: |
        ERR_MSG=$(grep -A 20 "What went wrong:" build.log || grep -A 20 "FAILURE:" build.log || tail -n 60 build.log)
        CLEAN_MSG=$(echo "$ERR_MSG" | tr '\r\n' ' ' | sed 's/"/\\"/g')
        echo "::error title=Gradle Failure::$CLEAN_MSG"

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OpenTVLauncher-Release-APK
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error
        retention-days: 14

